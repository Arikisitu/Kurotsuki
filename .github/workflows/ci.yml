name: SAHASRA CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Step 1: Core Monorepo Shared Types & Contracts ---
  shared-packages:
    name: Build & Validate Shared Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Core Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/api-contracts

      - name: Typecheck Core Packages
        run: |
          npm run typecheck --workspace=packages/shared-types
          npm run typecheck --workspace=packages/api-contracts

  # --- Step 2: Web Application (React + Vite) ---
  web-app:
    name: Web App Lint, Typecheck & Build
    needs: shared-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/api-contracts

      - name: Web Lint & Typecheck
        run: |
          if [ -d "apps/web" ]; then
            npm run lint --workspace=apps/web --if-present
            npm run typecheck --workspace=apps/web --if-present
            npm run test --workspace=apps/web --if-present
            npm run build --workspace=apps/web
          else
            echo "apps/web not yet provisioned; skipping."
          fi

  # --- Step 3: Backend Gateway (Cloudflare Workers / Express) ---
  backend-api:
    name: Backend API Test & Build
    needs: shared-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/api-contracts

      - name: API Test & Build
        run: |
          if [ -d "apps/api" ]; then
            npm run test --workspace=apps/api --if-present
            npm run typecheck --workspace=apps/api --if-present
            npm run build --workspace=apps/api --if-present
          else
            echo "apps/api not yet provisioned; skipping."
          fi

  # --- Step 4: Android Client (Kotlin + Jetpack Compose) ---
  android-client:
    name: Android Client Lint & Assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Android Project
        run: |
          if [ -f "apps/android/gradlew" ]; then
            cd apps/android
            chmod +x gradlew
            ./gradlew lintDebug assembleDebug
          else
            echo "apps/android not yet provisioned; skipping."
          fi
